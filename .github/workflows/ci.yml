name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    env:
      # Valores fictícios: o build não acessa o banco.
      NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-publica-de-exemplo
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes das regras de negócio
        run: npm test
      - name: Build de produção
        # Turbopack Google font resolution fails on clean GitHub runners.
        # Validate the full production build with Next.js supported webpack mode.
        run: npm run build -- --webpack
      - name: Validar estilos gerados
        run: node scripts/check-build-css.mjs
